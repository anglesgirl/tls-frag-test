name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: :app:assembleDebug --no-daemon
          gradle-version: "8.9"

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" "tls-frag-test-v1.0.0-debug.apk"
          ls -lh tls-frag-test-v1.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tls-frag-test-debug
          path: tls-frag-test-v1.0.0-debug.apk
